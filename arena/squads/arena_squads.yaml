# K9X Arena — squad flow definitions (loaded by SquadLoader.load_one).
# No orchestrator field: squads never reference their caller.

squads:
  SuiteSquad:
    description: Load the task suite and screen every prompt with k9x_Shield and Granite Guardian.
    agents: [SuiteLoaderAgent, InputScreenAgent]
    flow:
      - agent: SuiteLoaderAgent
        result_key: suite
      - agent: InputScreenAgent
        result_key: screening

  ContestantSquad:
    description: Run every task on every contender, grouped by model.
    agents: [ForcedRunAgent]
    flow:
      - agent: ForcedRunAgent
        result_key: forced

  GradingSquad:
    description: Deterministic graders, then Guardian's safety pass, then the LLM judge.
    agents: [CodeGraderAgent, ExtractionGraderAgent, ReasoningGraderAgent, SafetyGraderAgent, JudgeAgent]
    flow:
      - agent: CodeGraderAgent
        result_key: code
      - agent: ExtractionGraderAgent
        result_key: extraction
      - agent: ReasoningGraderAgent
        result_key: reasoning
      - agent: SafetyGraderAgent
        result_key: safety
      - agent: JudgeAgent
        result_key: judged

  ReportSquad:
    description: Stars and leaderboard, the held-out router test, recommended router config.
    agents: [ScoringAgent, RouterTestAgent, ConfigRecommenderAgent]
    flow:
      - agent: ScoringAgent
        result_key: scored
      - agent: RouterTestAgent
        result_key: router_test
      - agent: ConfigRecommenderAgent
        result_key: report
